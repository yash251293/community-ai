<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - The Local Assist</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="/manifest.json"> <!-- Added manifest link -->
    <meta name="theme-color" content="#007bff"> <!-- Added theme color -->
</head>
<body>
    <nav class="main-nav">
        <div class="nav-container container">
            <a href="index.html" class="nav-brand">The Local Assist</a>
            <ul class="nav-links">
                <li class="nav-item" id="nav-home"><a href="index.html">Home</a></li>
                <li class="nav-item" id="nav-requests"><a href="requests.html">View Requests</a></li>
                <li class="nav-item" id="nav-offers"><a href="offers.html">View Offers</a></li>
                
                <li class="nav-item" id="nav-login" style="display:none;"><a href="login.html">Login</a></li>
                <li class="nav-item" id="nav-signup" style="display:none;"><a href="signup.html" class="active">Sign Up</a></li>
    
                <li class="nav-item" id="nav-profile" style="display:none;"><a href="profile.html">My Profile</a></li>
                <li class="nav-item" id="nav-create-request" style="display:none;"><a href="create_request.html">Post Request</a></li>
                <li class="nav-item" id="nav-create-offer" style="display:none;"><a href="create_offer.html">Offer Service</a></li>
                <li class="nav-item" id="nav-conversations" style="display:none;"><a href="conversations.html">My Chats</a></li>
                <li class="nav-item" id="nav-logout" style="display:none;"><a href="#" id="logout-link" class="btn btn-secondary">Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <h1>Create Your Account</h1>
        <div id="form-feedback-message" class="message-feedback" style="display: none;"></div>
        <form id="signupForm">
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required minlength="6">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Sign Up</button>
        </form>
        <p class="text-center mt-3">Already have an account? <a href="login.html">Login here</a>.</p>
    </div>

    <script src="nav.js"></script> <!-- Added nav.js script -->
    <script>
        const signupForm = document.getElementById('signupForm');
        const feedbackContainer = document.getElementById('form-feedback-message');
        const submitButton = signupForm.querySelector('button[type="submit"]');

        signupForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            feedbackContainer.textContent = '';
            feedbackContainer.style.display = 'none';
            feedbackContainer.className = 'message-feedback'; 

            const originalButtonText = submitButton.textContent;
            submitButton.disabled = true;
            submitButton.textContent = 'Signing Up...';

            const name = event.target.name.value;
            const email = event.target.email.value;
            const password = event.target.password.value;

            if (password.length < 6) {
                feedbackContainer.textContent = 'Password must be at least 6 characters long.';
                feedbackContainer.className = 'message-feedback error';
                feedbackContainer.style.display = 'block';
                submitButton.disabled = false;
                submitButton.textContent = originalButtonText;
                return;
            }

            try {
                const response = await fetch('/api/users/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ Name: name, Email: email, Password: password }),
                });

                const result = await response.json();
                feedbackContainer.style.display = 'block'; // Make feedback visible

                if (response.ok) {
                    feedbackContainer.textContent = 'Registration successful! You can now login.';
                    feedbackContainer.className = 'message-feedback success';
                    signupForm.reset();
                    // Optionally redirect to login page after a delay
                    // setTimeout(() => { window.location.href = 'login.html'; }, 2000);
                } else {
                    feedbackContainer.textContent = `Error: ${result.message}`;
                    feedbackContainer.className = 'message-feedback error';
                }
            } catch (error) {
                console.error('Signup error:', error);
                feedbackContainer.style.display = 'block'; // Ensure feedback is visible on catch
                feedbackContainer.textContent = 'An unexpected error occurred. Please try again later.'; // Added "later"
                feedbackContainer.className = 'message-feedback error';
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = originalButtonText;
            }
        });
    </script>
</body>
</html>
