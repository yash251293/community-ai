    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#007bff">
    <!-- Removed inline <style> as #mapContainer and .map-title are now in global style.css -->
</head>
<body>
    <nav class="main-nav">
        <div class="nav-container container">
            <a href="index.html" class="nav-brand">The Local Assist</a>
            <ul class="nav-links">
                <li class="nav-item" id="nav-home"><a href="index.html">Home</a></li>
                <li class="nav-item" id="nav-requests"><a href="requests.html">View Requests</a></li>
                <li class="nav-item" id="nav-offers"><a href="offers.html">View Offers</a></li>
                
                <li class="nav-item" id="nav-login" style="display:none;"><a href="login.html">Login</a></li>
                <li class="nav-item" id="nav-signup" style="display:none;"><a href="signup.html">Sign Up</a></li>
    
                <li class="nav-item" id="nav-profile" style="display:none;"><a href="profile.html">My Profile</a></li>
                <li class="nav-item" id="nav-create-request" style="display:none;"><a href="create_request.html">Post Request</a></li>
                <li class="nav-item" id="nav-create-offer" style="display:none;"><a href="create_offer.html">Offer Service</a></li>
                <li class="nav-item" id="nav-conversations" style="display:none;"><a href="conversations.html">My Chats</a></li>
                <li class="nav-item" id="nav-logout" style="display:none;"><a href="#" id="logout-link" class="btn btn-secondary">Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <h1 id="mapTitle" class="map-title">Map</h1>
        <div id="form-feedback-message" class="message-feedback" style="display:none;"></div> <!-- For location message -->
        <div id="mapContainer">
            <!-- Map iframe will be inserted here -->
        </div>
        <!-- Removed old navigation paragraph -->
    </div>

    <script src="nav.js"></script>
    <script>
        const mapContainer = document.getElementById('mapContainer');
        const mapTitleElement = document.getElementById('mapTitle');
        const feedbackContainer = document.getElementById('form-feedback-message'); // Changed from messageElement

        function displayMap() {
            const params = new URLSearchParams(window.location.search);
            let locationQuery = params.get('location');

            feedbackContainer.style.display = 'none'; // Clear previous messages
            feedbackContainer.className = 'message-feedback';


            if (!locationQuery || locationQuery.trim() === "") {
                locationQuery = "Delhi, India"; 
                feedbackContainer.textContent = "No location specified, showing default map for Delhi, India.";
                feedbackContainer.className = 'message-feedback info';
                feedbackContainer.style.display = 'block';
            } else {
                 feedbackContainer.textContent = `Showing map for: ${escapeHTML(locationQuery)}`;
                 feedbackContainer.className = 'message-feedback info'; // Display as info
                 feedbackContainer.style.display = 'block';
            }
            
            mapTitleElement.textContent = `Map for: ${escapeHTML(locationQuery)}`;

            const iframe = document.createElement('iframe');
            iframe.setAttribute('loading', 'lazy');
            iframe.setAttribute('allowfullscreen', '');
            iframe.setAttribute('referrerpolicy', 'no-referrer-when-downgrade');
            
            const mapUrl = `https://maps.google.com/maps?q=${encodeURIComponent(locationQuery)}&t=&z=15&ie=UTF8&iwloc=&output=embed`;
            iframe.src = mapUrl;

            mapContainer.innerHTML = ''; 
            mapContainer.appendChild(iframe);
        }

        function escapeHTML(str) {
            if (typeof str !== 'string') return '';
            return str.replace(/[&<>"']/g, match => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[match]));
        }

        displayMap();
    </script>
</body>
</html>
