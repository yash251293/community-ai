<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - The Local Assist</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#007bff">
</head>
<body>
    <nav class="main-nav">
        <div class="nav-container container">
            <a href="index.html" class="nav-brand">The Local Assist</a>
            <ul class="nav-links">
                <li class="nav-item" id="nav-home"><a href="index.html">Home</a></li>
                <li class="nav-item" id="nav-requests"><a href="requests.html">View Requests</a></li>
                <li class="nav-item" id="nav-offers"><a href="offers.html">View Offers</a></li>
                
                <li class="nav-item" id="nav-login" style="display:none;"><a href="login.html">Login</a></li>
                <li class="nav-item" id="nav-signup" style="display:none;"><a href="signup.html">Sign Up</a></li>
    
                <li class="nav-item" id="nav-profile" style="display:none;"><a href="profile.html">My Profile</a></li>
                <li class="nav-item" id="nav-create-request" style="display:none;"><a href="create_request.html">Post Request</a></li>
                <li class="nav-item" id="nav-create-offer" style="display:none;"><a href="create_offer.html">Offer Service</a></li>
                <li class="nav-item" id="nav-conversations" style="display:none;"><a href="conversations.html">My Chats</a></li> 
                <li class="nav-item" id="nav-logout" style="display:none;"><a href="#" id="logout-link" class="btn btn-secondary">Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="container chat-container">
        <h1 id="chatHeader">Chat</h1>
        <div id="chatWindow">
            <!-- Messages will be loaded here -->
        </div>
        <div id="form-feedback-message" class="message-feedback" style="display: none; margin-bottom: 10px;"></div> 
        <form id="sendMessageForm">
            <textarea id="messageInput" placeholder="Type your message..." required rows="2"></textarea>
            <button type="submit" class="btn btn-primary">Send</button>
        </form>
    </div>

    <script src="nav.js"></script>
    <script>
        const chatHeader = document.getElementById('chatHeader');
        const chatWindow = document.getElementById('chatWindow');
        const sendMessageForm = document.getElementById('sendMessageForm');
        const messageInput = document.getElementById('messageInput');
        const feedbackContainer = document.getElementById('form-feedback-message');
        const sendButton = sendMessageForm.querySelector('button[type="submit"]');

        const params = new URLSearchParams(window.location.search);
        const currentUserId = params.get('currentUser');
        const otherUserId = params.get('otherUser');

        const loggedInUserId = localStorage.getItem('userId');
        if (!loggedInUserId || loggedInUserId !== currentUserId) {
            feedbackContainer.textContent = 'Error: You are not logged in or user ID mismatch. Redirecting to login...';
            feedbackContainer.className = 'message-feedback error';
            feedbackContainer.style.display = 'block';
            if(sendButton) sendButton.disabled = true;
            setTimeout(() => { window.location.href = 'login.html'; }, 2500);
        } else if (!otherUserId) {
            feedbackContainer.textContent = 'Error: No recipient specified for this chat.';
            feedbackContainer.className = 'message-feedback error';
            feedbackContainer.style.display = 'block';
            if(sendButton) sendButton.disabled = true;
            sendMessageForm.style.display = 'none'; 
        } else {
            chatHeader.textContent = `Chat with User ${otherUserId}`;
            fetchAndDisplayMessages();
        }

        function escapeHTML(str) {
            if (typeof str !== 'string') return '';
            return str.replace(/[&<>"']/g, match => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[match]));
        }

        async function fetchAndDisplayMessages() {
            if (!currentUserId || !otherUserId) return;

            try {
                const response = await fetch(`/api/messages?userId1=${currentUserId}&userId2=${otherUserId}`);
                if (!response.ok) {
                    const errText = await response.text(); 
                    let err = { message: `Could not load messages. Please check your connection or try again later. (Status: ${response.status})`};
                    try { 
                        const parsedErr = JSON.parse(errText);
                        err.message = parsedErr.message || err.message;
                    } catch (e) { /* Use default if not JSON */ }
                    throw new Error(err.message);
                }
                const messages = await response.json();
                chatWindow.innerHTML = ''; 

                if (messages.length === 0) {
                    chatWindow.innerHTML = '<p class="no-messages">No messages yet. Start the conversation!</p>';
                } else {
                    messages.forEach(msg => {
                        const messageDiv = document.createElement('div');
                        messageDiv.classList.add('message-bubble');
                        if (msg.SenderUserID === parseInt(currentUserId)) {
                            messageDiv.classList.add('sent');
                        } else {
                            messageDiv.classList.add('received');
                        }
                        messageDiv.innerHTML = `
                            <p class="msg-content">${escapeHTML(msg.MessageContent)}</p>
                            <span class="msg-timestamp">${new Date(msg.SentAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
                        `;
                        chatWindow.appendChild(messageDiv);
                    });
                }
                chatWindow.scrollTop = chatWindow.scrollHeight; 
            } catch (error) {
                console.error('Fetch messages error:', error);
                feedbackContainer.textContent = error.message; // Display more user-friendly error
                feedbackContainer.className = 'message-feedback error';
                feedbackContainer.style.display = 'block';
            }
        }

        sendMessageForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const content = messageInput.value.trim();

            feedbackContainer.textContent = ''; 
            feedbackContainer.style.display = 'none';
            feedbackContainer.className = 'message-feedback';
            
            const originalButtonText = sendButton.textContent; // Store original text
            sendButton.disabled = true;
            sendButton.textContent = 'Sending...';


            if (!content) {
                feedbackContainer.textContent = 'Cannot send an empty message.';
                feedbackContainer.className = 'message-feedback error';
                feedbackContainer.style.display = 'block';
                sendButton.disabled = false; 
                sendButton.textContent = originalButtonText; // Restore text
                return;
            }
            if (!currentUserId || !otherUserId) {
                feedbackContainer.textContent = 'User information is missing. Cannot send message.';
                feedbackContainer.className = 'message-feedback error';
                feedbackContainer.style.display = 'block';
                sendButton.disabled = false;
                sendButton.textContent = originalButtonText; // Restore text
                return;
            }

            try {
                const response = await fetch('/api/messages', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ senderId: currentUserId, receiverId: otherUserId, content }),
                });
                
                const resultText = await response.text();
                let result = { message: `Message could not be sent. Please try again. (Status: ${response.status})`};
                try { 
                    const parsedResult = JSON.parse(resultText);
                    result.message = parsedResult.message || result.message;
                } catch (e) { /* Use default if not JSON */ }

                if (response.ok) {
                    messageInput.value = ''; 
                    fetchAndDisplayMessages(); 
                } else {
                    throw new Error(result.message);
                }
            } catch (error) {
                console.error('Send message error:', error);
                feedbackContainer.textContent = `Error: ${error.message}`; // Display user-friendly error
                feedbackContainer.className = 'message-feedback error';
                feedbackContainer.style.display = 'block';
            } finally {
                sendButton.disabled = false;
                sendButton.textContent = originalButtonText; // Restore text in finally
            }
        });
    </script>
</body>
</html>
