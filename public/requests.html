<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Requests - The Local Assist</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#007bff">
</head>
<body>
    <nav class="main-nav">
        <div class="nav-container container">
            <a href="index.html" class="nav-brand">The Local Assist</a>
            <ul class="nav-links">
                <li class="nav-item" id="nav-home"><a href="index.html">Home</a></li>
                <li class="nav-item" id="nav-requests"><a href="requests.html" class="active">View Requests</a></li>
                <li class="nav-item" id="nav-offers"><a href="offers.html">View Offers</a></li>
                
                <li class="nav-item" id="nav-login" style="display:none;"><a href="login.html">Login</a></li>
                <li class="nav-item" id="nav-signup" style="display:none;"><a href="signup.html">Sign Up</a></li>
    
                <li class="nav-item" id="nav-profile" style="display:none;"><a href="profile.html">My Profile</a></li>
                <li class="nav-item" id="nav-create-request" style="display:none;"><a href="create_request.html">Post Request</a></li>
                <li class="nav-item" id="nav-create-offer" style="display:none;"><a href="create_offer.html">Offer Service</a></li>
                <li class="nav-item" id="nav-conversations" style="display:none;"><a href="conversations.html">My Chats</a></li>
                <li class="nav-item" id="nav-logout" style="display:none;"><a href="#" id="logout-link" class="btn btn-secondary">Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <h1>Available Service Requests</h1>
        <div id="form-feedback-message" class="message-feedback" style="display: none;"></div> <!-- For loading errors -->
        <div id="requestsList" class="item-list">
            <!-- Requests will be loaded here by JavaScript -->
        </div>
        <!-- Old navigation <p> tags removed -->
    </div>

    <script src="nav.js"></script>
    <script>
        const requestsList = document.getElementById('requestsList');
        const feedbackContainer = document.getElementById('form-feedback-message'); // Changed from messageElement

        async function fetchRequests() {
            try {
                const response = await fetch('/api/requests');
                if (!response.ok) {
                    const errorResult = await response.json(); // Try to get error message from API
                    throw new Error(errorResult.message || `HTTP error! status: ${response.status}`);
                }
                const requests = await response.json();
                feedbackContainer.style.display = 'none'; // Clear previous messages

                if (requests.length === 0) {
                    feedbackContainer.textContent = 'No service requests found at the moment.';
                    feedbackContainer.className = 'message-feedback info'; // Use info class
                    feedbackContainer.style.display = 'block';
                    return;
                }

                requestsList.innerHTML = ''; // Clear previous list items
                requests.forEach(request => {
                    const item = document.createElement('div');
                    item.className = 'list-item';
                    // Applied .btn and .btn-info to links for consistency
                    item.innerHTML = `
                        <h3>${escapeHTML(request.Title)}</h3>
                        <p><strong>Category:</strong> ${escapeHTML(request.Category)}</p>
                        <p><strong>Location:</strong> ${escapeHTML(request.Location)}</p>
                        <p><strong>Status:</strong> ${escapeHTML(request.Status)}</p>
                        <p><small>Posted: ${new Date(request.CreatedAt).toLocaleDateString()}</small></p>
                        <a href="matches.html?type=request&id=${request.RequestID}" class="btn btn-primary btn-sm">Find Matches</a>
                        ${request.Location ? `<a href="map.html?location=${encodeURIComponent(request.Location)}" class="btn btn-info btn-sm view-map-link" target="_blank">View on Map</a>` : ''}
                    `;
                    requestsList.appendChild(item);
                });

            } catch (error) {
                console.error('Fetch requests error:', error);
                feedbackContainer.textContent = 'Could not load service requests. Please check your connection or try again later.';
                // Optionally append more technical error: + ` (${error.message})`
                feedbackContainer.className = 'message-feedback error';
                feedbackContainer.style.display = 'block';
            }
        }

        function escapeHTML(str) {
            if (typeof str !== 'string') return ''; // Handle non-string inputs gracefully
            return str.replace(/[&<>"']/g, function (match) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#39;'
                }[match];
            });
        }

        fetchRequests();
    </script>
</body>
</html>
