<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - The Local Assist</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Login</h1>
        <form id="loginForm">
            <div>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">Login</button>
        </form>
        <p id="message"></p>
        <p>Don't have an account? <a href="signup.html">Sign up here</a>.</p>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const messageElement = document.getElementById('message');

        loginForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            messageElement.textContent = ''; // Clear previous messages

            const email = event.target.email.value;
            const password = event.target.password.value;

            try {
                const response = await fetch('/api/users/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ Email: email, Password: password }),
                });

                const result = await response.json();

                if (response.ok) {
                    messageElement.textContent = 'Login successful!';
                    messageElement.style.color = 'green';
                    localStorage.setItem('mockToken', result.token);
                    // Extract UserID from token (assuming format "mock-token-for-USERID")
                    const userId = result.token.split('-').pop();
                    localStorage.setItem('userId', userId); 
                    loginForm.reset();
                    window.location.href = `profile.html`; // Redirect to profile page
                } else {
                    messageElement.textContent = `Error: ${result.message}`;
                    messageElement.style.color = 'red';
                }
            } catch (error) {
                console.error('Login error:', error);
                messageElement.textContent = 'An unexpected error occurred. Please try again.';
                messageElement.style.color = 'red';
            }
        });
    </script>
</body>
</html>
